 if(k==='slide'){const first=R.x==null,x=first?m.hp.x:R.x+(m.hp.x-R.x)*.5;R.x=x;if(first)R.lo=R.hi=x;R.lo=Math.min(R.lo,x);R.hi=Math.max(R.hi,x);let leg=0;
  if(R.dir<=0&&x-R.lo>tor){leg=R.dir===-1?1:0;R.dir=1;R.hi=x}else if(R.dir>=0&&R.hi-x>tor){leg=R.dir===1?1:0;R.dir=-1;R.lo=x}
  const low=h>.22;if(low)R.gf+=dt;if(leg){R.n++;R.sc+=low?10:4}}
 else if(k==='hold'){if(h>.22&&h<.8){R.gf+=dt;R.cs+=dt;R.bs=Math.max(R.bs,R.cs)}else R.cs=0;R.sc=R.gf}
 else if(k==='jump'){const y=m.hp.y,up=R.base-y;
  if(!R.air){if(up>tor*.25){R.air=1;R.pk=up}else if(Math.abs(up)<tor*.15)R.base+=(y-R.base)*.12}
  else{R.pk=Math.max(R.pk,up);if(up<tor*.1){R.air=0;const cm=R.pk/tor*((+profile.h||170)*.29);R.pk=0;if(cm>=8&&cm<=120){R.n++;R.hs.push(cm);if(S.d.max<9000&&R.n>=S.d.max)finishDrill()}}}}
 else if(k==='squat'){if(!R.ph){if(h>.3){R.dn+=dt;if(R.dn>=.15){R.ph=1;R.mx=h}}else R.dn=0}else{R.mx=Math.max(R.mx,h);if(h<.15){R.ph=0;R.dn=0;if(R.mx>=.6)R.n++;else R.sh++;R.mx=0}}}
 else if(k==='jacks'){const w=[m.lw,m.rw].filter(Boolean),aw=m.la&&m.ra&&m.sw?Math.abs(m.la.x-m.ra.x)/m.sw:null;
  if(w.length&&aw!=null){const wy=w.reduce((a,q)=>a+q.y,0)/w.length,up=wy<m.sh.y-tor*.2,dn=wy>m.sh.y+tor*.45;
   if(!R.ph&&up&&aw>1.6){R.ph=1;R.n++}else if(R.ph&&dn&&aw<1.2)R.ph=0}}
 else if(k==='knees'){for(const[hh,kn,i]of[[m.lh,m.lk,'L'],[m.rh,m.rk,'Rg']])if(hh&&kn){const up=kn.y<hh.y+tor*.12,dn=kn.y>hh.y+tor*.5;if(!R[i]&&up){R[i]=1;R.n++}else if(R[i]&&dn)R[i]=0}}}
function poStats(el){const R=S.PO.R,k=S.d.k,e=Math.max(el,1),P=Math.round(R.gf/Math.max(R.tf,1)*100)+'%',r=(R.n/e).toFixed(1);
 if(k==='slide')return{v:R.sc,x:[R.n,P,r]};if(k==='hold')return{v:Math.round(R.gf),x:[P,Math.round(R.bs)]};
 if(k==='jump')return{v:R.hs.length?Math.round(Math.max(...R.hs)):0,x:[R.n,R.hs.length?Math.round(R.hs.reduce((a,c)=>a+c,0)/R.hs.length):0]};
 if(k==='squat')return{v:R.n,x:[R.sh,r]};return{v:R.n,x:[r]}}
function poPanel(){const c=POK[S.d.k];return`<div class="big"><b id="pv">0</b><i style="font-size:20px">${c.u}</i></div><div class="stats">${c.st.map((l,i)=>`<span>${l}<b id="p${i+1}">0</b></span>`).join('')}<span>Waktu<b id="tm">0:00.0</b></span></div><button class="btn" data-a="finish">Selesai</button>`}
function poUI(el){const q=i=>$('#'+i);if(!q('pv')||!S.PO||!S.PO.R)return;const o=poStats(el);q('pv').textContent=o.v;o.x.forEach((v,i)=>{const e=q('p'+(i+1));if(e)e.textContent=v});
 const R=S.PO.R;if(opt.coach&&el>8&&el-R.ct>=10){R.ct=el;coachPose(el)}}
function poSum(R,dur){const k=S.d.k,P=Math.round(R.gf/Math.max(R.tf,1)*100),r=(R.n/Math.max(dur,1)).toFixed(1)+'/dtk',W=['Waktu',fmt(dur)];
 if(k==='slide')return{val:R.sc+' poin',sum:`${R.n} slide, stance rendah ${P}%`,ex:[['Poin',R.sc,1],['Slide',R.n],['Stance rendah',P+'%'],['Kecepatan',r],W]};
 if(k==='hold')return{val:Math.round(R.gf)+' dtk',sum:`stance benar ${Math.round(R.gf)} dtk (${P}%)`,ex:[['Stance benar',Math.round(R.gf)+' dtk',1],['Persen waktu',P+'%'],['Beruntun terbaik',Math.round(R.bs)+' dtk'],W]};
 if(k==='jump'){const b=R.hs.length?Math.max(...R.hs):0,a=R.hs.length?R.hs.reduce((x,y)=>x+y,0)/R.hs.length:0;return{val:Math.round(b)+' cm',sum:`${R.n} lompatan, terbaik ${Math.round(b)} cm`,ex:[['Terbaik (perkiraan)',Math.round(b)+' cm',1],['Rata-rata',Math.round(a)+' cm'],['Lompatan',R.n],W]}}
 if(k==='squat')return{val:R.n+' squat',sum:`${R.n} squat, ${R.sh} kurang dalam`,ex:[['Squat sah',R.n,1],['Kurang dalam',R.sh],['Kecepatan',r],W]};
 return{val:R.n+' rep',sum:`${R.n} ${k==='jacks'?'jumping jack':'angkat lutut'}, ${r}`,ex:[['Jumlah',R.n,1],['Kecepatan',r],W]}}
async function poTick(){try{let src=S.v,sc=1;if(S.L&&S.L<95){const c=S.pl||(S.pl=document.createElement('canvas'));c.width=480;c.height=Math.round(480*S.v.videoHeight/S.v.videoWidth);c.getContext('2d',{willReadFrequently:true}).drawImage(S.v,0,0,c.width,c.height);lift(c);src=c;sc=S.v.videoWidth/480}
 const P=(await S.pose.estimatePoses(src))[0];if(!S.on)return;if(P&&sc!==1)P.keypoints.forEach(q=>{q.x*=sc;q.y*=sc});S.P=P||null;
 if(P){const m=poMet(P);if(m){S.pt=performance.now();if(S.phase==='ready'||S.phase==='count')poCal(m);else if(S.phase==='run'&&S.PO.R)poStep(m,performance.now())}}}catch{}}
function drawPose(c){const P=S.P;if(!P)return;c.lineWidth=4;c.strokeStyle='#3ddc84';LIM.forEach(([a,b])=>{const p=kpm(P,a),q=kpm(P,b);if(p&&q){c.beginPath();c.moveTo(p.x,p.y);c.lineTo(q.x,q.y);c.stroke()}});c.fillStyle='#ff7a29';P.keypoints.forEach(q=>{if(q.score>.3){c.beginPath();c.arc(q.x,q.y,6,0,7);c.fill()}})}
function coachPose(el){const R=S.PO.R,k=S.d.k,P=Math.round(R.gf/Math.max(R.tf,1)*100),rate=R.n/Math.max(el,1);let t;
 if(k==='slide')t=P<60?'Badan masih terlalu tinggi. Turunkan pinggul dan tekuk lutut waktu slide.':rate<.9?'Tempo slide masih pelan. Dorong lebih cepat dari kaki belakang tanpa menyilangkan kaki.':'Slide kamu bagus. Jaga posisi tetap rendah sampai akhir.';
 else if(k==='hold')t=P<70?'Posisimu naik turun. Tahan pinggul rendah dan dada tegak.':'Mantap, pertahankan posisi rendah ini.';
 else if(k==='jump'){const h=R.hs;t=h.length>=3&&h[h.length-1]<Math.max(...h)*.85?'Tenaga mulai turun. Istirahat sebentar, lalu lompat dengan ayunan lengan penuh.':'Dorong lantai sekuat tenaga dan ayunkan lengan ke atas saat lompat.'}
 else if(k==='squat')t=R.sh>R.n?'Banyak squat yang kurang dalam. Turunkan pinggul sampai paha hampir sejajar lantai.':'Squat kamu rapi. Jaga lutut searah jari kaki.';
 else t=rate<1.2?'Tempomu masih pelan. Percepat sambil menjaga gerakan tetap penuh.':'Tempo bagus. Pertahankan sampai waktu habis.';
 ai('pose',{latihan:S.d.n,berjalanDetik:Math.round(el),jumlah:R.n,perDetik:+rate.toFixed(1),stancePersen:P,lompatanTerbaikCm:k==='jump'&&R.hs.length?Math.round(Math.max(...R.hs)):undefined,kurangDalam:R.sh,beruntunTerbaikDetik:Math.round(R.bs)},t)}
/* ---- kamera: anti layar hitam ---- */
async function wl(){try{if(S.on&&navigator.wakeLock&&!(S.wlk&&!S.wlk.released))S.wlk=await navigator.wakeLock.request('screen')}catch{}}
async function camFix(){if(!S.on||S.fixing)return;S.fixing=1;S.ws=0;try{const t=S.stream&&S.stream.getVideoTracks()[0];if(t&&t.readyState==='live'&&!t.muted&&S.v.paused)await S.v.play();else await openCam()}catch{toast('Kamera terputus. Ketuk tombol ganti kamera untuk membuka ulang.')}finally{S.fixing=0}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.on){wl();camFix()}});
function stopCam(){if(S.rv){try{S.rv.mr.stop()}catch{}S.rv=null}try{S.wlk&&S.wlk.release()}catch{}S.wlk=null;try{screen.orientation.unlock();document.fullscreenElement&&document.exitFullscreen()}catch{}S.on=false;cancelAnimationFrame(S.raf);S.stream?.getTracks().forEach(t=>t.stop())}
function finishDrill(){if(S.done)return;S.done=1;const dur=S.phase==='run'?(performance.now()-S.t0)/1000:0;const hadV=!!S.rv,vp=vrStop();stopCam();
 const s={id:Date.now().toString(36),drill:S.d.id,name:S.d.n,date:Date.now(),dur,shots:S.shots,vid:hadV?1:0},D=S.dr,bye=m=>{sess.hidden=true;sess.innerHTML='';toast(m)};
 if(S.d.m==='dribble'){if(!D||!D.n)return bye('Belum ada dribble terdeteksi');s.dr={n:D.n,score:D.sc,esc:D.esc,mv:S.d.mv?1:0,sw:D.sw,rate:D.n/Math.max(dur,1),h:Math.round(D.hs.reduce((a,b)=>a+b,0)/D.hs.length)}}
 else if(S.d.m==='pose'){const R=S.PO&&S.PO.R;if(!R||!(R.n||R.gf>1))return bye('Belum ada gerakan terdeteksi');s.po=poSum(R,dur)}
 else if(!s.shots.length)return bye('Belum ada tembakan terdeteksi');
 const pick=(a,n)=>a.length<=n?a:Array.from({length:n},(_,i)=>a[Math.floor(i*(a.length-1)/(n-1))]);
 let fr=[];if(opt.vis)fr=S.d.m==='dribble'||S.d.m==='pose'?pick(S.fb.map(f=>f.u),3):s.shots.filter(x=>x.fr).sort((a,b)=>a.m-b.m).slice(0,4).map(x=>x.fr);
 s.shots.forEach(x=>{delete x.fr});
 sessions.unshift(s);persist();saveSession(s);
 if(hadV)vp.then(async b=>{if(b&&await vrSave(s.id,b))vrShow(s.id);else{s.vid=0;persist();const e=$('#vbox');if(e)e.innerHTML='<p class="sub">Video gagal disimpan di perangkat ini.</p>'}});
 sess.innerHTML=`<div class="res"><h1>${s.name}</h1>${resBody(s)}${fr.length?'<div class="item" style="display:block;margin-top:12px"><small>Analisis AI</small><span id="ait" style="white-space:pre-line">Menganalisis gerakanmu...</span></div>':''}${hadV?'<div id="vbox"><p class="sub">Menyimpan video...</p></div>':''}<button class="btn" data-a="fin">Lihat riwayat</button></div>`;
 if(fr.length)vis('form',fr,{latihan:s.name,tangan:profile.hand,posisi:profile.pos,hasil:S.d.m==='dribble'?s.dr:S.d.m==='pose'?s.po:stats([s])}).then(j=>{const t=j&&j.text||'Analisis AI tidak tersedia saat ini.',e=$('#ait');if(e)e.textContent=t;if(j&&j.text){s.ai=t;persist()}})}
document.addEventListener('contextmenu',e=>e.preventDefault());['gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n,e=>e.preventDefault()));document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
(()=>{const i=$('#intro');if(!i)return;const end=()=>{i.classList.add('out');setTimeout(()=>i.remove(),500)};setTimeout(end,matchMedia('(prefers-reduced-motion:reduce)').matches?900:2800)})();
init();
